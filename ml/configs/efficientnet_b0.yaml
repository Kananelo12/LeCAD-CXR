# Baseline run. Copy this file per experiment rather than editing it —
# the config IS the record of what produced a given result.
name: efficientnet-b0

model:
  architecture: efficientnet_b0    # densenet121 | resnet50 | efficientnet_b0
  pretrained: true              # ImageNet weights; see transforms.py for stats

data:
  image_size: 224
  batch_size: 32
  num_workers: 4

optim:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  use_pos_weight: true          # counter class imbalance in BCE
  # Stop when val macro AUC has not improved for this many epochs. The
  # baseline (run 1, 15 full epochs) peaked at epoch 4; stopping here would
  # have produced the identical best.pt. Remove the line to disable.
  early_stopping_patience: 3

eval:
  primary_metric: macro_auc     # prevalence-insensitive; see splits.py
  # Hernia (141 train_val images) and Pneumonia (876) are too sparse for a
  # trustworthy per-class AUC. Report with a caveat, do not quietly drop.
  report_per_class: true
