[project]
name = "lecad"
version = "0.1.0"
description = "LeCAD-CXR — multi-disease chest X-ray classification for Lesotho"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["matplotlib>=3.8", "seaborn>=0.13", "tensorboard>=2.16", "grad-cam>=1.5"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
         "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "argon2-cffi>=23.1",
         "python-jose[cryptography]>=3.3", "huggingface-hub>=0.22"]
dev = ["ruff>=0.3", "pytest>=8.0", "jupyter>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py310"
