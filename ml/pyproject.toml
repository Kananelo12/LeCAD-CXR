[project]
name = "lecad"
version = "0.1.0"
description = "LeCAD-CXR — multi-disease chest X-ray classification for Lesotho"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# pyyaml is for training configs only. Keeping it out of serving lets the API
# install on new Pythons it has no ready-made package for yet.
train = ["pyyaml>=6.0", "matplotlib>=3.8", "seaborn>=0.13", "tensorboard>=2.16",
         "grad-cam>=1.5"]
# Plain uvicorn, not uvicorn[standard]: that extra adds pyyaml and C speedups
# the API does not need, and they lag behind new Python releases.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
         "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "argon2-cffi>=23.1",
         "pyjwt>=2.8"]
dev = ["ruff>=0.3", "pytest>=8.0", "httpx>=0.27", "jupyter>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

# Explicit rule set, so lint results do not change when ruff's defaults do.
[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused names, undefined names
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # modern syntax for the target Python
    "C4",      # comprehensions
    "SIM",     # simplifications
    "FURB",    # refurb
    "RUF",     # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["lecad"]
# evaluate.py imports predict() from the sibling train.py script.
known-local-folder = ["train"]

[tool.ruff.lint.per-file-ignores]
# A notebook's setup cell locates the repo and extends sys.path before importing.
"*.ipynb" = ["E402"]
